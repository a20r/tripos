[workspace]
members = ["engine"]

[package]
name = "tripos"
version = "0.1.0"
edition = "2021"
publish = false
description = "Tripos: a Blade Runner themed SET card game for phones and tablets, in Rust and WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tripos-engine = { path = "engine" }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "AddEventListenerOptions",
  "BroadcastChannel",
  "Clipboard",
  "CssStyleDeclaration",
  "Document",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "HtmlElement",
  "HtmlButtonElement",
  "HtmlAudioElement",
  "HtmlCollection",
  "HtmlInputElement",
  "HtmlMediaElement",
  "KeyboardEvent",
  "Location",
  "MediaDevices",
  "MediaStream",
  "MediaStreamConstraints",
  "MediaStreamTrack",
  "MessageEvent",
  "MouseEvent",
  "Navigator",
  "Node",
  "PointerEvent",
  "NodeList",
  "Request",
  "RequestInit",
  "Response",
  "RtcConfiguration",
  "RtcDataChannel",
  "RtcDataChannelEvent",
  "RtcDataChannelState",
  "RtcIceCandidate",
  "RtcIceCandidateInit",
  "RtcIceServer",
  "RtcPeerConnection",
  "RtcPeerConnectionIceEvent",
  "RtcPeerConnectionState",
  "RtcRtpSender",
  "RtcRtpTransceiver",
  "RtcRtpTransceiverDirection",
  "RtcRtpTransceiverInit",
  "RtcSdpType",
  "RtcSessionDescription",
  "RtcSessionDescriptionInit",
  "RtcTrackEvent",
  "ShareData",
  "Storage",
  "UrlSearchParams",
  "WebSocket",
  "Window",
  "console",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
